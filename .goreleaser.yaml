version: 2
project_name: byway
builds:
  - main: ./cmd/byway
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/Gabrigeno/byway/internal/cli.Version={{.Version}}
archives:
  - files: [LICENSE, README.md, contrib/fish/byway.fish]
checksum:
  name_template: checksums.txt

brews:
  - repository:
      owner: Gabrigeno
      name: homebrew-byway
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/Gabrigeno/byway
    description: Save shell commands by name, run them anywhere
    license: MIT
    install: |
      bin.install "byway"
      (share/"fish/vendor_conf.d").install "contrib/fish/byway.fish"
    test: |
      system "#{bin}/byway", "--version"
